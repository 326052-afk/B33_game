<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG - 決戦！魔王討伐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'DotGothic16', monospace;
            user-select: none;
            touch-action: none;
        }

        /* ブラウン管(CRT)エフェクト */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 画面揺れアニメーション */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-active { animation: shake 0.4s; }
        .shake-heavy { animation: shake 0.8s; }

        /* UIウィンドウの装飾 */
        .rpg-window {
            background: rgba(0, 0, 20, 0.85);
            border: 3px solid #fbbf24;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.5), inset 0 0 15px rgba(251, 191, 36, 0.2);
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        /* コマンドボタン */
        .cmd-btn {
            background: transparent;
            color: #fff;
            border: 1px solid transparent;
            padding: 8px 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            font-size: 1.2rem;
            position: relative;
        }
        .cmd-btn:hover, .cmd-btn:focus {
            border: 1px solid #fbbf24;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .cmd-btn::before {
            content: '▶';
            position: absolute;
            left: 0;
            opacity: 0;
            color: #fbbf24;
            transition: opacity 0.1s;
        }
        .cmd-btn:hover::before, .cmd-btn:focus::before { opacity: 1; left: -5px; }
        
        .char-active {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #fbbf24; box-shadow: 0 0 5px #fbbf24; }
            50% { border-color: #fef08a; box-shadow: 0 0 15px #fef08a; }
            100% { border-color: #fbbf24; box-shadow: 0 0 5px #fbbf24; }
        }

        /* ダメージテキストの光彩 */
        .glow-text {
            text-shadow: 0 0 8px currentColor;
        }
    </style>
</head>
<body>

<div id="game-container" class="crt">
    <!-- 魔王のステータス (画面上部) -->
    <div id="boss-status" class="absolute top-4 left-1/2 transform -translate-x-1/2 w-4/5 md:w-1/2 rpg-window p-2 z-10" style="display: none;">
        <div class="flex justify-between text-white font-bold mb-1 text-sm md:text-base">
            <span class="text-red-500 glow-text">魔王</span>
            <span>HP: <span id="hp-boss">3000</span></span>
        </div>
        <div class="w-full bg-gray-900 h-3 rounded border border-gray-700">
            <div id="hp-bar-boss" class="bg-red-600 h-full rounded transition-all duration-300" style="width: 100%; box-shadow: 0 0 10px rgba(220,38,38,0.8);"></div>
        </div>
    </div>

    <!-- キャンバスエリア (戦闘描画) -->
    <canvas id="battle-canvas" class="flex-grow w-full"></canvas>

    <!-- UIエリア (ステータス・コマンド) -->
    <div id="ui-area" class="h-[40vh] w-full absolute bottom-0 flex flex-col p-2 gap-2" style="display: none;">
        
        <!-- メッセージウィンドウ -->
        <div id="message-window" class="rpg-window h-1/3 w-full text-white text-lg md:text-2xl p-4 flex items-center">
            <span id="message-text">魔王が あらわれた！</span>
        </div>

        <!-- ステータス一覧 -->
        <div class="h-2/3 flex gap-2 w-full">
            <!-- 勇者 -->
            <div id="stat-hero" class="rpg-window flex-1 p-2 text-white flex flex-col justify-center">
                <div class="font-bold text-yellow-400 mb-1">勇者</div>
                <div class="text-sm md:text-base flex justify-between"><span>HP</span><span id="hp-hero">150</span></div>
                <div class="w-full bg-gray-700 h-2 mb-2 rounded"><div id="hp-bar-hero" class="bg-green-500 h-2 rounded" style="width: 100%"></div></div>
                <div class="text-sm md:text-base flex justify-between text-blue-300"><span>MP</span><span id="mp-hero">30</span></div>
            </div>
            <!-- ナイト -->
            <div id="stat-knight" class="rpg-window flex-1 p-2 text-white flex flex-col justify-center">
                <div class="font-bold text-yellow-400 mb-1">ナイト</div>
                <div class="text-sm md:text-base flex justify-between"><span>HP</span><span id="hp-knight">200</span></div>
                <div class="w-full bg-gray-700 h-2 mb-2 rounded"><div id="hp-bar-knight" class="bg-green-500 h-2 rounded" style="width: 100%"></div></div>
                <div class="text-sm md:text-base flex justify-between text-blue-300"><span>MP</span><span id="mp-knight">10</span></div>
            </div>
            <!-- メイジ -->
            <div id="stat-mage" class="rpg-window flex-1 p-2 text-white flex flex-col justify-center">
                <div class="font-bold text-yellow-400 mb-1">メイジ</div>
                <div class="text-sm md:text-base flex justify-between"><span>HP</span><span id="hp-mage">90</span></div>
                <div class="w-full bg-gray-700 h-2 mb-2 rounded"><div id="hp-bar-mage" class="bg-green-500 h-2 rounded" style="width: 100%"></div></div>
                <div class="text-sm md:text-base flex justify-between text-blue-300"><span>MP</span><span id="mp-mage">80</span></div>
            </div>
            <!-- ヒーラー -->
            <div id="stat-healer" class="rpg-window flex-1 p-2 text-white flex flex-col justify-center">
                <div class="font-bold text-yellow-400 mb-1">僧侶</div>
                <div class="text-sm md:text-base flex justify-between"><span>HP</span><span id="hp-healer">110</span></div>
                <div class="w-full bg-gray-700 h-2 mb-2 rounded"><div id="hp-bar-healer" class="bg-green-500 h-2 rounded" style="width: 100%"></div></div>
                <div class="text-sm md:text-base flex justify-between text-blue-300"><span>MP</span><span id="mp-healer">60</span></div>
            </div>
        </div>

        <!-- コマンドウィンドウ (絶対配置でアクティブキャラの横に表示) -->
        <div id="command-window" class="rpg-window absolute hidden flex-col p-2 z-10 w-40">
            <button id="cmd-atk" class="cmd-btn pl-6">たたかう</button>
            <button id="cmd-skill" class="cmd-btn pl-6">スキル</button>
        </div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="absolute inset-0 bg-black flex flex-col items-center justify-center z-50 crt">
        <h1 class="text-4xl md:text-6xl text-red-600 font-bold mb-8 text-center glow-text" style="text-shadow: 0 0 10px red;">RPG<br>決戦！魔王討伐</h1>
        <button id="start-btn" class="rpg-window px-8 py-4 text-white text-2xl hover:bg-white hover:text-black transition-colors cursor-pointer">
            GAME START
        </button>
        <p class="text-gray-400 mt-4 text-sm">※サウンドが再生されます</p>
    </div>
</div>

<script>
/**
 * 定数・アセット定義
 */
// カラーパレット
const P = {
    'c': null, // 透明
    '0': '#000000', // アウトライン
    '1': '#fcd34d', // 肌色
    '2': '#ffffff', // 白
    '3': '#94a3b8', // 銀(鎧)
    '4': '#fbbf24', // 金(装飾)
    '5': '#2563eb', // 青(勇者)
    '6': '#dc2626', // 赤(魔王/メイジ)
    '7': '#16a34a', // 緑(ヒーラー)
    '8': '#9333ea', // 紫
    '9': '#020617', // 魔王本体
    'A': '#4c1d95', // 魔王影

// 勇者ドット絵 (16x16)
const heroArt = [

// ナイトドット絵 (盾と槍) (16x16)
const knightArt = [

// メイジドット絵 (杖と帽子) (16x16)
const mageArt = [
    "cccc0000cccccccc",
    "ccc066660cc00ccc",
    "cc066666600440cc",
    "c000000000000ccc",
    "ccc011110cc0cccc",
    "cc01000010c0cccc",

    "cc06666660cccccc",

];

// ヒーラードット絵 (ロッド) (16x16)
const healerArt = [
    "cccccccccccccccc",
    "ccccc0000cc000cc",
    "cccc0777700220cc",
    "ccc01111110000cc",
    "cc01000010c0cccc",
    "cc0101110100cccc",
    "ccc01111000ccccc",
    "cc00222200cccccc",
    "c0202772020ccccc",
    "c0202222020ccccc",

];

// 魔王ドット絵 (32x32) 巨大
const bossArt = [
    "cccccccccccccccccccccccccccccccc",
    "ccccccc0cccccccccccccccc0ccccccc",
    "cccccc060cccccccccccccc060cccccc",
    "cccccc0600cccccccccccc0060cccccc",
    "cccccc0660cccccccccccc0660cccccc",
    "ccccc06660cccccccccccc06660ccccc",
    "ccccc0666000000000000006660ccccc",
    "ccccc0660999999999999990660ccccc",
    "cccc06609A999A9999A999A90660cccc",
    "cccc06099900999999009999060cccc",
    "ccc0609990660999906609999060ccc",
    "ccc0099990000999900009999900ccc",
    "ccc0999A99999900999999A99990ccc",
    "ccc0999999900066000999999990ccc",
    "cc099999999066666609999999990cc",
    "cc0A99A99A9900000099A99A99A90cc",
    "cc099999999999999999999999990cc",
    "c09990000999999999999000099990c",
    "c09908888009999999900888809990c",
    "c0A908888880000000088888809A90c",
    "c09908888888888888888888809990c",
    "c09990088888888888888880099990c",
    "cc099990008888888888000999990cc",
    "cc0A9999990000000000999999A90cc",
    "ccc0999999999999999999999990ccc",
    "ccc0A999A999A999A999A999A990ccc",
    "cccc00000000000000000000000cccc",
    "cccccc0A9A9A9A9A9A9A9A9A0cccccc",
    "cccccc0999999999999999990cccccc",
    "ccccccc00000000000000000ccccccc",
    "cccccccccccccccccccccccccccccccc",
    "cccccccccccccccccccccccccccccccc"
];


/**
 * オーディオ (Tone.js) 管理
 */
let bgmSynth, sfxSynth, noiseSynth, metalSynth;
let audioInitialized = false;
let toneTimeOffset = 0.05; // エラー回避用

async function initAudio() {
    if (audioInitialized) return;
    await Tone.start();
    
    // BGM用 (矩形波寄り)
    bgmSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "square" },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 0.5 }
    }).toDestination();
    bgmSynth.volume.value = -15;

    // SE用 (効果音)
    sfxSynth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "triangle" },
        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
    }).toDestination();
    sfxSynth.volume.value = -10;

    // ノイズ (打撃音)
    noiseSynth = new Tone.NoiseSynth({
        noise: { type: 'white' },
        envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
    }).toDestination();
    noiseSynth.volume.value = -12;

    audioInitialized = true;
    playBGM();
}

function safeNow() {
    return Tone.now() + toneTimeOffset;
}

// BGM再生
function playBGM() {
    const melody = [
        {"time": "0:0", "note": "E3", "dur": "8n"},
        {"time": "0:0:2", "note": "E3", "dur": "8n"},
        {"time": "0:1", "note": "B2", "dur": "8n"},
        {"time": "0:1:2", "note": "E3", "dur": "8n"},
        {"time": "0:2", "note": "G3", "dur": "4n"},
        {"time": "0:3", "note": "F#3", "dur": "4n"},
        {"time": "1:0", "note": "E3", "dur": "8n"},
        {"time": "1:0:2", "note": "E3", "dur": "8n"},
        {"time": "1:1", "note": "B2", "dur": "8n"},
        {"time": "1:1:2", "note": "D3", "dur": "8n"},
        {"time": "1:2", "note": "E3", "dur": "2n"}
    ];
    const part = new Tone.Part((time, value) => {
        bgmSynth.triggerAttackRelease(value.note, value.dur, time);
    }, melody);
    part.loop = true;
    part.loopEnd = "2m";
    Tone.Transport.bpm.value = 100;
    Tone.Transport.start();
    part.start(0);
}

const Sounds = {
    select: () => { if(audioInitialized) sfxSynth.triggerAttackRelease("C6", "32n", safeNow()); },
    hit: () => { if(audioInitialized) noiseSynth.triggerAttackRelease("8n", safeNow()); },
    heavyHit: () => { 
        if(!audioInitialized) return;
        noiseSynth.triggerAttackRelease("4n", safeNow());
        sfxSynth.triggerAttackRelease("C2", "8n", safeNow());
    },
    magic: () => {
        if(!audioInitialized) return;
        const now = safeNow();
        sfxSynth.triggerAttackRelease("C5", "16n", now);
        sfxSynth.triggerAttackRelease("E5", "16n", now + 0.1);
        sfxSynth.triggerAttackRelease("G5", "8n", now + 0.2);
    },
    heal: () => {
        if(!audioInitialized) return;
        const now = safeNow();
        sfxSynth.triggerAttackRelease(["C4", "E4", "G4"], "4n", now);
    },
    charge: () => {
        if(!audioInitialized) return;
        const now = safeNow();
        bgmSynth.triggerAttackRelease("C2", "2n", now);
    }
};

/**
 * ゲームステータス・ロジック
 */
const boss = { 
    name: '魔王', maxHp: 3000, hp: 3000, 
    x: 0, y: 0, baseX: 0, baseY: 0, floatOffset: 0,
    state: 'normal', // normal, charging
    shake: 0
};

const party = [
    { id: 'hero', name: '勇者', maxHp: 150, hp: 150, maxMp: 30, mp: 30, art: heroArt, x:0, y:0, baseX:0, baseY:0, isDefending: false, shake:0 },
    { id: 'knight', name: 'ナイト', maxHp: 200, hp: 200, maxMp: 10, mp: 10, art: knightArt, x:0, y:0, baseX:0, baseY:0, isDefending: false, shake:0 },
    { id: 'mage', name: 'メイジ', maxHp: 90, hp: 90, maxMp: 80, mp: 80, art: mageArt, x:0, y:0, baseX:0, baseY:0, isDefending: false, shake:0 },
    { id: 'healer', name: '僧侶', maxHp: 110, hp: 110, maxMp: 60, mp: 60, art: healerArt, x:0, y:0, baseX:0, baseY:0, isDefending: false, shake:0 }
];

let gameState = 'START'; // START, PLAYER_TURN, ACTION, BOSS_TURN, GAME_OVER, VICTORY
let turnIndex = 0; // 0~3: player, 4: boss
let pixelSize = 4;
let frameCount = 0;

// パーティクル・テキスト管理
let particles = [];
let damageTexts = [];

class Particle {
    constructor(x, y, color, speed, life, isLighter = false) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * speed;
        this.vy = (Math.random() - 0.5) * speed;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = Math.random() * 2 + 1;
        this.isLighter = isLighter;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life--;
    }
    draw(ctx) {
        if(this.isLighter) ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillRect(this.x, this.y, this.size * pixelSize, this.size * pixelSize);
        ctx.globalAlpha = 1.0;
        ctx.globalCompositeOperation = 'source-over';
    }
}

class DamageText {
    constructor(x, y, text, color) {
        this.x = x; this.y = y;
        this.text = text;
        this.color = color;
        this.life = 60;
        this.vy = -2;
    }
    update() {
        this.y += this.vy;
        this.vy *= 0.9;
        this.life--;
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.font = `italic bold ${pixelSize * 6}px 'DotGothic16', monospace`;
        ctx.textAlign = 'center';
        ctx.globalAlpha = Math.max(0, this.life / 60);
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fillText(this.text, this.x, this.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
    }
}

/**
 * 描画ロジック
 */
const canvas = document.getElementById('battle-canvas');
const ctx = canvas.getContext('2d');
let cw, ch;

function resize() {
    cw = canvas.clientWidth;
    ch = canvas.clientHeight;
    canvas.width = cw;
    canvas.height = ch;
    pixelSize = Math.max(1.0, Math.floor(cw / 250)); 
    
    // 配置計算
    boss.baseX = cw * 0.2;
    boss.baseY = ch * 0.4;
    
    const startY = ch * 0.2;
    const gapY = (ch * 0.5) / 3;
    party.forEach((p, i) => {
        p.baseX = cw * 0.8;
        p.baseY = startY + (gapY * i);
    });
}
window.addEventListener('resize', resize);

function drawPixelArt(x, y, art, size, shake = 0) {
    const sx = x + (Math.random() - 0.5) * shake;
    const sy = y + (Math.random() - 0.5) * shake;
    for (let r = 0; r < art.length; r++) {
        for (let c = 0; c < art[r].length; c++) {
            const char = art[r][c];
            if (P[char]) {
                ctx.fillStyle = P[char];
                ctx.fillRect(sx + c * size, sy + r * size, size, size);
            }
        }
    }
}

function draw() {
    frameCount++;
    ctx.fillStyle = '#020208';
    ctx.fillRect(0, 0, cw, ch);

    // 背景グリッドエフェクト
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#1e1b4b';
    ctx.lineWidth = 1;
    const gridSize = 10;
    const offset = (frameCount * 0.5) % gridSize;
    for(let i = -gridSize; i < cw; i+=gridSize) {
        ctx.beginPath(); ctx.moveTo(i + offset, 0); ctx.lineTo(i + offset, ch); ctx.stroke();
    }
    for(let i = -gridSize; i < ch; i+=gridSize) {
        ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(cw, i + offset); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    // ボス描画
    if (boss.hp > 0) {
        boss.floatOffset = Math.sin(frameCount * 0.05) * 10;
        
        // 溜め状態のオーラ
        if (boss.state === 'charging') {
            ctx.globalCompositeOperation = 'lighter';
            for(let i=0; i<5; i++) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
                ctx.beginPath();
                ctx.arc(boss.baseX + (bossArt[0].length * pixelSize * 1.5)/2, boss.baseY + boss.floatOffset + (bossArt.length * pixelSize * 1.5)/2, pixelSize * 25 + Math.random()*20, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
        }
        
        drawPixelArt(boss.baseX, boss.baseY + boss.floatOffset, bossArt, pixelSize * 1.5, boss.shake);
        if(boss.shake > 0) boss.shake--;
    }

    // パーティ描画
    party.forEach(p => {
        if (p.hp > 0) {
            // アクティブターンのキャラは少し前に出る
            const isActive = (gameState === 'PLAYER_TURN' && party[turnIndex] === p);
            p.x = p.baseX - (isActive ? pixelSize * 5 : 0);
            p.y = p.baseY;
            
            drawPixelArt(p.x, p.y, p.art, pixelSize * 2, p.shake);
            if(p.shake > 0) p.shake--;

            if (p.isDefending) {
                ctx.globalCompositeOperation = 'lighter';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x + pixelSize*16, p.y + pixelSize*16, pixelSize * 20, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            }
        }
    });

    // エフェクト更新描画
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = damageTexts.length - 1; i >= 0; i--) {
        damageTexts[i].update();
        damageTexts[i].draw(ctx);
        if (damageTexts[i].life <= 0) damageTexts.splice(i, 1);
    }

    requestAnimationFrame(draw);
}

/**
 * ゲーム進行・UIロジック
 */
function updateUI() {
    // 魔王のHP更新
    document.getElementById('hp-boss').innerText = boss.hp;
    document.getElementById('hp-bar-boss').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;

    party.forEach(p => {
        document.getElementById(`hp-${p.id}`).innerText = p.hp;
        document.getElementById(`mp-${p.id}`).innerText = p.mp;
        document.getElementById(`hp-bar-${p.id}`).style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
        
        const statEl = document.getElementById(`stat-${p.id}`);
        if(p.hp <= 0) {
            statEl.style.opacity = '0.3';
            statEl.classList.remove('char-active');
        } else if (gameState === 'PLAYER_TURN' && party[turnIndex] === p) {
            statEl.classList.add('char-active');
        } else {
            statEl.classList.remove('char-active');
        }
    });
}

function showMessage(text, callback) {
    const msgEl = document.getElementById('message-text');
    msgEl.innerText = "";
    let i = 0;
    
    function type() {
        if (i < text.length) {
            msgEl.innerText += text.charAt(i);
            if(i % 2 === 0) Sounds.select();
            i++;
            setTimeout(type, 30);
        } else {
            if(callback) setTimeout(callback, 800);
        }
    }
    type();
}

function spawnParticles(x, y, color, count, isLighter=false) {
    for(let i=0; i<count; i++) {
        particles.push(new Particle(x, y, color, 15, 30 + Math.random()*20, isLighter));
    }
}

function screenShake(heavy = false) {
    const container = document.getElementById('game-container');
    container.classList.remove('shake-active', 'shake-heavy');
    void container.offsetWidth; // reflow
    container.classList.add(heavy ? 'shake-heavy' : 'shake-active');
}

function nextTurn() {
    if(boss.hp <= 0) return winGame();
    if(party.every(p => p.hp <= 0)) return loseGame();

    turnIndex++;
    if (turnIndex >= party.length) {
        turnIndex = -1;
        gameState = 'BOSS_TURN';
        doBossTurn();
    } else {
        const actor = party[turnIndex];
        if (actor.hp <= 0) {
            nextTurn(); // 死亡スキップ
        } else {
            gameState = 'PLAYER_TURN';
            actor.isDefending = false; // ターンが回ってきたら防御解除
            setupCommandWindow(actor);
            updateUI();
        }
    }
}

function setupCommandWindow(actor) {
    const cmdWin = document.getElementById('command-window');
    const btnSkill = document.getElementById('cmd-skill');
    
    // ボタンのテキスト設定
    if (actor.id === 'hero') btnSkill.innerText = '全力斬り(MP10)';
    else if (actor.id === 'knight') btnSkill.innerText = 'かばう';
    else if (actor.id === 'mage') btnSkill.innerText = 'まほう(MP20)';
    else if (actor.id === 'healer') btnSkill.innerText = 'かいふく(MP20)';

    // 表示位置計算 (UIエリアからの相対位置)
    cmdWin.style.display = 'flex';
    cmdWin.style.right = '20px';
    cmdWin.style.bottom = '80px';
}

function hideCommandWindow() {
    document.getElementById('command-window').style.display = 'none';
}

// プレイヤーターン処理
document.getElementById('cmd-atk').addEventListener('click', () => {
    if(gameState !== 'PLAYER_TURN') return;
    hideCommandWindow();
    const actor = party[turnIndex];
    gameState = 'ACTION';
    
    showMessage(`${actor.name} の こうげき！`, () => {
        Sounds.hit();
        boss.shake = 10;
        const dmg = Math.floor(Math.random() * 10 + 20); // 20~30
        boss.hp = Math.max(0, boss.hp - dmg);
        spawnParticles(boss.baseX + 30, boss.baseY + 30, '#ffffff', 20);
        damageTexts.push(new DamageText(boss.baseX + 30, boss.baseY, dmg.toString(), '#ffffff'));
        nextTurn();
    });
});

document.getElementById('cmd-skill').addEventListener('click', () => {
    if(gameState !== 'PLAYER_TURN') return;
    const actor = party[turnIndex];
    
    // MPチェック
    let cost = 0;
    if(actor.id === 'hero') cost = 10;
    if(actor.id === 'mage' || actor.id === 'healer') cost = 20;
    
    if(actor.mp < cost) {
        showMessage('MPが たりない！', () => { setupCommandWindow(actor); });
        hideCommandWindow();
        return;
    }
    
    hideCommandWindow();
    actor.mp -= cost;
    updateUI();
    gameState = 'ACTION';

    if (actor.id === 'hero') {
        showMessage(`${actor.name} の ぜんりょくぎり！`, () => {
            Sounds.heavyHit();
            screenShake();
            boss.shake = 20;
            const dmg = Math.floor(Math.random() * 20 + 80); // 80-100
            boss.hp = Math.max(0, boss.hp - dmg);
            spawnParticles(boss.baseX + 30, boss.baseY + 30, '#fbbf24', 40, true);
            damageTexts.push(new DamageText(boss.baseX + 30, boss.baseY, dmg.toString(), '#fbbf24'));
            nextTurn();
        });
    } else if (actor.id === 'knight') {
        showMessage(`${actor.name} は みがまえを とった！`, () => {
            actor.isDefending = true;
            Sounds.heal();
            spawnParticles(actor.x, actor.y, '#38bdf8', 20, true);
            nextTurn();
        });
    } else if (actor.id === 'mage') {
        showMessage(`${actor.name} の まほう！`, () => {
            Sounds.magic();
            screenShake();
            boss.shake = 15;
            const dmg = Math.floor(Math.random() * 20 + 100); // 100-120
            boss.hp = Math.max(0, boss.hp - dmg);
            spawnParticles(boss.baseX + 30, boss.baseY + 30, '#c026d3', 60, true);
            damageTexts.push(new DamageText(boss.baseX + 30, boss.baseY, dmg.toString(), '#c026d3'));
            nextTurn();
        });
    } else if (actor.id === 'healer') {
        showMessage(`${actor.name} の かいふく！`, () => {
            Sounds.heal();
            party.forEach(p => {
                if(p.hp > 0) {
                    p.hp = Math.min(p.maxHp, p.hp + 60);
                    spawnParticles(p.x, p.y, '#4ade80', 10, true);
                    damageTexts.push(new DamageText(p.x, p.y - 20, '60', '#4ade80'));
                }
            });
            updateUI();
            nextTurn();
        });
    }
});

// ボスターン処理
function doBossTurn() {
    updateUI();
    if(boss.state === 'charging') {
        // 必殺技
        boss.state = 'normal';
        showMessage(`魔王 の ダークビッグバン！！`, () => {
            Sounds.heavyHit();
            Sounds.magic();
            screenShake(true);
            party.forEach(p => {
                if(p.hp > 0) {
                    p.shake = 20;
                    let dmg = Math.floor(Math.random() * 30 + 80); // 80-110
                    if(p.isDefending) dmg = Math.floor(dmg * 0.2); // 防御時は8割カット
                    p.hp = Math.max(0, p.hp - dmg);
                    spawnParticles(p.x, p.y, '#dc2626', 30, true);
                    damageTexts.push(new DamageText(p.x, p.y, dmg.toString(), '#dc2626'));
                }
            });
            updateUI();
            setTimeout(nextTurn, 1000);
        });
        return;
    }

    const r = Math.random();
    if (r < 0.3) {
        // 力をためる
        boss.state = 'charging';
        showMessage(`魔王 は 邪悪な 力をためている！！`, () => {
            Sounds.charge();
            setTimeout(nextTurn, 500);
        });
    } else if (r < 0.6) {
        // 全体攻撃
        showMessage(`魔王 の やみのほのお！`, () => {
            Sounds.magic();
            screenShake();
            party.forEach(p => {
                if(p.hp > 0) {
                    p.shake = 10;
                    let dmg = Math.floor(Math.random() * 10 + 20); // 20-30
                    if(p.isDefending) dmg = Math.floor(dmg * 0.2);
                    p.hp = Math.max(0, p.hp - dmg);
                    spawnParticles(p.x, p.y, '#9333ea', 15, true);
                    damageTexts.push(new DamageText(p.x, p.y, dmg.toString(), '#9333ea'));
                }
            });
            updateUI();
            setTimeout(nextTurn, 800);
        });
    } else {
        // 単体攻撃
        showMessage(`魔王 の こうげき！`, () => {
            const alive = party.filter(p => p.hp > 0);
            const target = alive[Math.floor(Math.random() * alive.length)];
            Sounds.heavyHit();
            target.shake = 15;
            let dmg = Math.floor(Math.random() * 20 + 40); // 40-60
            if(target.isDefending) dmg = Math.floor(dmg * 0.2);
            target.hp = Math.max(0, target.hp - dmg);
            spawnParticles(target.x, target.y, '#ffffff', 20);
            damageTexts.push(new DamageText(target.x, target.y, dmg.toString(), '#ffffff'));
            updateUI();
            setTimeout(nextTurn, 800);
        });
    }
}

function winGame() {
    gameState = 'VICTORY';
    Tone.Transport.stop();
    hideCommandWindow();
    boss.shake = 50;
    Sounds.heavyHit();
    screenShake(true);
    spawnParticles(boss.baseX, boss.baseY, '#ffffff', 200, true);
    setTimeout(() => {
        boss.hp = 0; // 表示から消す
        showMessage('魔王 を やまぼった！！\nせかいに へいわが もどった！');
    }, 1500);
}

function loseGame() {
    gameState = 'GAME_OVER';
    Tone.Transport.stop();
    hideCommandWindow();
    showMessage('ゆうしゃ たちは ぜんめつした・・・\nせかいは やみに つつまれた。');
}

/**
 * 初期化処理
 */
document.getElementById('start-btn').addEventListener('click', async () => {
    await initAudio();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('ui-area').style.display = 'flex';
    document.getElementById('boss-status').style.display = 'block';
    resize();
    
    // ゲーム開始演出
    gameState = 'ACTION';
    setTimeout(() => {
        showMessage('魔王 が あらわれた！', () => {
            turnIndex = -1; // -1から初めてnextTurn()で0(勇者)に
            nextTurn();
        });
    }, 500);
});

// 描画ループ開始
resize();
requestAnimationFrame(draw);

</script>
